# Text-only DPO smoke (tiny local LM). Not a Qwen2.5-VL experiment.
# Proves dataset adapter + TRL/PEFT plumbing without touching baseline weights.

experiment_type: dpo
prefs_path: tests/fixtures/reward_model/synthetic_bt_prefs.jsonl
output_dir: runs/dpo
run_id: dpo_text_smoke
model_id: REPLACE_WITH_LOCAL_TINY_LM
reference_model_id: null
baseline_run_dir: runs/baseline-stub-heldout-v1
dataset_version: synthetic-bt-v0
beta: 0.1
learning_rate: 1.0e-4
max_steps: 4
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
logging_steps: 1
save_steps: 4
seed: 0
max_length: 128
use_peft: true
lora_r: 4
lora_alpha: 8
lora_dropout: 0.0
lora_target_modules:
  - c_attn
allow_download: false
modality: text
require_vlm_ready: false
checkpoint_selection: last_train_step
notes: >
  Smoke only. Real Qwen2.5-VL DPO requires CUDA, local VLM weights, modality=vision,
  and a TRL build with mm_token_type_ids vision support (verified in probe).
