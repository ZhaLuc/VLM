# Qwen2.5-VL GRPO template (blocked until CUDA + local weights + ready_for_vlm_grpo).
# Do not invent multimodal workarounds when the stack probe reports not ready.

experiment_type: grpo
manifest: data/examples/toy_manifest.jsonl
output_dir: runs/grpo
run_id: grpo_qwen25vl_3b
model_id: Qwen/Qwen2.5-VL-3B-Instruct
baseline_run_dir: null
dataset_version: toy-v0
reward_id: hidden_state_exact_match
reward_version: "1.0.0"
num_generations: 4
learning_rate: 1.0e-6
max_steps: 50
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
logging_steps: 1
save_steps: 25
seed: 0
max_completion_length: 64
temperature: 0.7
top_p: 1.0
beta: 0.0
use_peft: true
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - v_proj
allow_download: false
modality: vision
require_vlm_ready: true
checkpoint_selection: last_train_step
eval_held_out_after_train: true
notes: >
  Template only. On this host, Torch is CPU-only so ready_for_vlm_grpo is false.
  Point model_id at a local checkpoint and run when CUDA + stack probe allow it.
