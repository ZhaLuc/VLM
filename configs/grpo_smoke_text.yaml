# Text-only GRPO smoke on hidden-state exact-match reward.
# Proves dataset adapter + TRL GRPO/PEFT plumbing without VLM weights.
# Reward gain is NOT reasoning improvement.

experiment_type: grpo
manifest: data/examples/toy_manifest.jsonl
output_dir: runs/grpo
run_id: grpo_text_smoke
model_id: REPLACE_WITH_LOCAL_TINY_LM
baseline_run_dir: runs/baseline-stub-heldout-v1
dataset_version: toy-v0
reward_id: hidden_state_exact_match
reward_version: "1.0.0"
num_generations: 2
learning_rate: 1.0e-5
max_steps: 2
per_device_train_batch_size: 2
gradient_accumulation_steps: 1
logging_steps: 1
save_steps: 2
seed: 0
max_completion_length: 32
max_prompt_length: 128
temperature: 0.8
top_p: 1.0
beta: 0.0
use_peft: true
lora_r: 4
lora_alpha: 8
lora_dropout: 0.0
lora_target_modules:
  - c_attn
allow_download: false
modality: text
require_vlm_ready: false
checkpoint_selection: last_train_step
eval_held_out_after_train: true
notes: >
  Smoke only. Real Qwen2.5-VL GRPO requires CUDA, local VLM weights, modality=vision,
  and a verified TRL multimodal path (see probe_grpo_stack).
