<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
  <rect width="900" height="320" fill="#f7f8fa"/>
  <text x="24" y="32" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111">Dataset grouping and evaluation axes</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#111">
    <rect x="24" y="55" width="270" height="220" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="159" y="90" text-anchor="middle" font-weight="700">Metadata</text>
    <text x="44" y="125">clip / trick / performer</text>
    <text x="44" y="155">camera / question</text>
    <text x="44" y="185">ground truth</text>
    <text x="44" y="215">provenance</text>
    <text x="44" y="245">split (held_out)</text>
    <rect x="315" y="55" width="270" height="220" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="450" y="90" text-anchor="middle" font-weight="700">Avoid leakage</text>
    <text x="335" y="125">not random frame splits</text>
    <text x="335" y="155">group by trick/setup</text>
    <text x="335" y="185">held_out frozen</text>
    <text x="335" y="215">no train on held_out</text>
    <text x="335" y="245">provenance required</text>
    <rect x="606" y="55" width="270" height="220" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="741" y="90" text-anchor="middle" font-weight="700">Eval axes (planned)</text>
    <text x="626" y="125">seen / unseen trick</text>
    <text x="626" y="155">unseen performer</text>
    <text x="626" y="185">unseen camera</text>
    <text x="626" y="215">new wording</text>
    <text x="626" y="245">ordered vs shuffled</text>
  </g>
</svg>
