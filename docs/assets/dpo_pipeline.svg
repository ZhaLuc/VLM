<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300">
  <rect width="820" height="300" fill="#f7f8fa"/>
  <text x="24" y="32" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111">DPO: preferences without a separate reward model</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#111">
    <rect x="40" y="70" width="220" height="90" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="150" y="100" text-anchor="middle">video + question</text>
    <text x="150" y="125" text-anchor="middle">+ chosen answer</text>
    <text x="150" y="148" text-anchor="middle">+ rejected answer</text>
    <line x1="260" y1="115" x2="300" y2="115" stroke="#111" stroke-width="2"/>
    <polygon points="300,110 312,115 300,120" fill="#111"/>
    <rect x="312" y="90" width="160" height="50" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/>
    <text x="392" y="120" text-anchor="middle">DPO update</text>
    <line x1="472" y1="115" x2="512" y2="115" stroke="#9a3412" stroke-width="2"/>
    <polygon points="512,110 524,115 512,120" fill="#9a3412"/>
    <rect x="524" y="90" width="160" height="50" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/>
    <text x="604" y="120" text-anchor="middle">updated VLM</text>
    <text x="40" y="210">No separate reward model. No conventional PPO loop.</text>
    <text x="40" y="240">Intended project role: explanation / preference task (not completed on real data).</text>
  </g>
</svg>
