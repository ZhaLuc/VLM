<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="DPO pipeline">
  <rect width="720" height="300" fill="#f6f3ee"/>
  <text x="20" y="28" font-family="Georgia, serif" font-size="16" fill="#1c1917">DPO: preferences without a separate reward model</text>
  <g font-family="Georgia, serif" font-size="13" fill="#1c1917">
    <rect x="40" y="70" width="200" height="80" rx="4" fill="#fff" stroke="#1c1917"/>
    <text x="140" y="100" text-anchor="middle">video + question</text>
    <text x="140" y="125" text-anchor="middle">+ chosen answer</text>
    <text x="140" y="145" text-anchor="middle">+ rejected answer</text>
    <path d="M250 110 H320" stroke="#1c1917" stroke-width="2" marker-end="url(#a)"/>
    <rect x="325" y="85" width="140" height="50" rx="4" fill="#ffedd5" stroke="#9a3412"/><text x="395" y="115" text-anchor="middle">DPO update</text>
    <path d="M470 110 H540" stroke="#9a3412" stroke-width="2" marker-end="url(#b)"/>
    <rect x="545" y="85" width="140" height="50" rx="4" fill="#ffedd5" stroke="#9a3412"/><text x="615" y="115" text-anchor="middle">updated VLM</text>
    <text x="40" y="200">No separate reward model. No conventional PPO loop.</text>
    <text x="40" y="230">Intended project role: explanation / preference task (not completed on real data).</text>
  </g>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1c1917"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9a3412"/></marker>
  </defs>
</svg>
