<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380">
  <rect width="860" height="380" fill="#f7f8fa"/>
  <text x="24" y="32" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111">GRPO: relative advantage within one prompt group</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#111">
    <rect x="320" y="50" width="220" height="42" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="430" y="77" text-anchor="middle">one prompt</text>
    <line x1="430" y1="92" x2="430" y2="115" stroke="#111" stroke-width="2"/>
    <line x1="150" y1="115" x2="710" y2="115" stroke="#111" stroke-width="2"/>
    <line x1="150" y1="115" x2="150" y2="140" stroke="#111" stroke-width="2"/>
    <line x1="330" y1="115" x2="330" y2="140" stroke="#111" stroke-width="2"/>
    <line x1="530" y1="115" x2="530" y2="140" stroke="#111" stroke-width="2"/>
    <line x1="710" y1="115" x2="710" y2="140" stroke="#111" stroke-width="2"/>
    <rect x="90" y="145" width="120" height="48" fill="#fff" stroke="#111" stroke-width="2"/><text x="150" y="175" text-anchor="middle">answer A</text>
    <rect x="270" y="145" width="120" height="48" fill="#fff" stroke="#111" stroke-width="2"/><text x="330" y="175" text-anchor="middle">answer B</text>
    <rect x="470" y="145" width="120" height="48" fill="#fff" stroke="#111" stroke-width="2"/><text x="530" y="175" text-anchor="middle">answer C</text>
    <rect x="650" y="145" width="120" height="48" fill="#fff" stroke="#111" stroke-width="2"/><text x="710" y="175" text-anchor="middle">answer D</text>
    <text x="150" y="230" text-anchor="middle">r = 0.9</text>
    <text x="330" y="230" text-anchor="middle">r = 0.7</text>
    <text x="530" y="230" text-anchor="middle">r = 0.2</text>
    <text x="710" y="230" text-anchor="middle">r = 0.1</text>
    <rect x="180" y="260" width="500" height="80" fill="#dcfce7" stroke="#14532d" stroke-width="2"/>
    <text x="430" y="292" text-anchor="middle">mean = 0.475   pop. std ~ 0.3345</text>
    <text x="430" y="318" text-anchor="middle">advantages ~ +1.27, +0.67, -0.82, -1.12</text>
  </g>
