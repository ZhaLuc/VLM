<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460">
  <rect width="760" height="460" fill="#f7f8fa"/>
  <text x="24" y="32" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111">Hidden-state task (Mac King S6)</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#111">
    <rect x="200" y="55" width="360" height="48" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="380" y="85" text-anchor="middle">coin visible in right hand</text>
    <line x1="380" y1="103" x2="380" y2="125" stroke="#111" stroke-width="2"/>
    <polygon points="375,125 380,137 385,125" fill="#111"/>
    <rect x="200" y="140" width="360" height="48" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="380" y="170" text-anchor="middle">apparent transfer</text>
    <line x1="380" y1="188" x2="380" y2="210" stroke="#111" stroke-width="2"/>
    <polygon points="375,210 380,222 385,210" fill="#111"/>
    <rect x="200" y="225" width="360" height="48" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="380" y="255" text-anchor="middle">coin remains hidden</text>
    <line x1="380" y1="273" x2="380" y2="295" stroke="#111" stroke-width="2"/>
    <polygon points="375,295 380,307 385,295" fill="#111"/>
    <rect x="200" y="310" width="360" height="48" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="380" y="340" text-anchor="middle">video ends (no reveal)</text>
    <line x1="380" y1="358" x2="380" y2="380" stroke="#111" stroke-width="2"/>
    <polygon points="375,380 380,392 385,380" fill="#111"/>
    <rect x="120" y="395" width="520" height="48" fill="#dcfce7" stroke="#14532d" stroke-width="2"/>
    <text x="380" y="415" text-anchor="middle">Q: Which hand contains the coin after the apparent transfer?</text>
    <text x="380" y="433" text-anchor="middle">ground truth = right</text>
  </g>
</svg>
