<svg xmlns="http://www.w3.org/2000/svg" width="780" height="260" viewBox="0 0 780 260" role="img" aria-label="Reward hacking">
  <rect width="780" height="260" fill="#f6f3ee"/>
  <text x="20" y="28" font-family="Georgia, serif" font-size="16" fill="#1c1917">Reward hacking intuition</text>
  <g font-family="Georgia, serif" font-size="14" fill="#1c1917">
    <rect x="40" y="70" width="300" height="120" rx="4" fill="#ffedd5" stroke="#9a3412"/>
    <text x="190" y="110" text-anchor="middle">proxy reward</text>
    <text x="190" y="140" text-anchor="middle">0.40 ’ 0.90</text>
    <text x="190" y="165" text-anchor="middle">looks like success</text>
    <rect x="400" y="70" width="340" height="120" rx="4" fill="#fff" stroke="#1c1917"/>
    <text x="570" y="110" text-anchor="middle">true task accuracy</text>
    <text x="570" y="140" text-anchor="middle">50% ’ 51%</text>
    <text x="570" y="165" text-anchor="middle">almost no real gain</text>
    <text x="40" y="230">The model learned the evaluator better than the underlying task  independent metrics are required.</text>
  </g>
</svg>
