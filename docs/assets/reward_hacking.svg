<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280">
  <rect width="860" height="280" fill="#f7f8fa"/>
  <text x="24" y="32" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111">Reward hacking intuition</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#111">
    <rect x="40" y="70" width="320" height="120" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/>
    <text x="200" y="110" text-anchor="middle">proxy reward</text>
    <text x="200" y="140" text-anchor="middle">0.40 -&gt; 0.90</text>
    <text x="200" y="168" text-anchor="middle">looks like "success"</text>
    <rect x="400" y="70" width="420" height="120" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="610" y="110" text-anchor="middle">true task accuracy</text>
    <text x="610" y="140" text-anchor="middle">50% -&gt; 51%</text>
    <text x="610" y="168" text-anchor="middle">almost no real gain</text>
    <text x="40" y="240">The model learned the evaluator better than the underlying task - independent metrics are required.</text>
  </g>
</svg>
