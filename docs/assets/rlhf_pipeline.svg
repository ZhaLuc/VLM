<svg xmlns="http://www.w3.org/2000/svg" width="780" height="320" viewBox="0 0 780 320" role="img" aria-label="RLHF pipeline">
  <rect width="780" height="320" fill="#f6f3ee"/>
  <text x="20" y="28" font-family="Georgia, serif" font-size="16" fill="#1c1917">RLHF sketch</text>
  <g font-family="Georgia, serif" font-size="13" fill="#1c1917">
    <rect x="40" y="60" width="120" height="50" rx="4" fill="#fff" stroke="#1c1917"/><text x="100" y="90" text-anchor="middle">base model</text>
    <path d="M100 110 V135" stroke="#1c1917" stroke-width="2" marker-end="url(#a)"/>
    <rect x="25" y="140" width="150" height="50" rx="4" fill="#fff" stroke="#1c1917"/><text x="100" y="170" text-anchor="middle">candidate answers</text>
    <path d="M100 190 V215" stroke="#1c1917" stroke-width="2" marker-end="url(#a)"/>
    <rect x="25" y="220" width="150" height="50" rx="4" fill="#fff" stroke="#1c1917"/><text x="100" y="250" text-anchor="middle">human preferences</text>
    <path d="M180 245 H240" stroke="#1c1917" stroke-width="2" marker-end="url(#a)"/>
