    <path d="M390 245 H450" stroke="#1c1917" stroke-width="2" marker-end="url(#a)"/>
    <rect x="455" y="220" width="140" height="50" rx="4" fill="#ffedd5" stroke="#9a3412"/><text x="525" y="250" text-anchor="middle">RL optimize</text>
