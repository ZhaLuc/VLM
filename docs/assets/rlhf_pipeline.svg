    <rect x="665" y="220" width="90" height="50" rx="4" fill="#ffedd5" stroke="#9a3412"/><text x="710" y="250" text-anchor="middle">updated</text>
  </g>
  <text x="20" y="305" font-family="Georgia, serif" font-size="12" fill="#9a3412">Not run on real preferences in this repository (paused)</text>
  <defs>
