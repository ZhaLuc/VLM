<svg xmlns="http://www.w3.org/2000/svg" width="780" height="280" viewBox="0 0 780 280" role="img" aria-label="What is a VLM">
  <rect width="780" height="280" fill="#f6f3ee"/>
  <text x="20" y="28" font-family="Georgia, serif" font-size="16" fill="#1c1917">Vision-language model (VLM)</text>
  <g font-family="Georgia, serif" font-size="13" fill="#1c1917">
    <rect x="30" y="60" width="140" height="60" rx="4" fill="#fff" stroke="#1c1917"/>
    <text x="100" y="95" text-anchor="middle">VIDEO / IMAGE</text>
    <rect x="30" y="150" width="140" height="60" rx="4" fill="#fff" stroke="#1c1917"/>
    <text x="100" y="185" text-anchor="middle">TEXT</text>
    <path d="M175 90 H220" stroke="#1c1917" stroke-width="2"/>
    <path d="M175 180 H220" stroke="#1c1917" stroke-width="2"/>
    <path d="M220 90 V180" stroke="#1c1917" stroke-width="2"/>
    <path d="M220 135 H270" stroke="#1c1917" stroke-width="2" marker-end="url(#a)"/>
    <rect x="275" y="90" width="200" height="90" rx="4" fill="#fff" stroke="#1c1917"/>
    <text x="375" y="125" text-anchor="middle">visual information</text>
    <text x="375" y="145" text-anchor="middle">+</text>
    <text x="375" y="165" text-anchor="middle">language information</text>
    <path d="M480 135 H530" stroke="#1c1917" stroke-width="2" marker-end="url(#a)"/>
    <rect x="535" y="90" width="200" height="90" rx="4" fill="#dcfce7" stroke="#14532d"/>
    <text x="635" y="130" text-anchor="middle">multimodal model</text>
    <text x="635" y="155" text-anchor="middle">’ text response</text>
  </g>
  <text x="20" y="255" font-family="Georgia, serif" font-size="12" fill="#57534e">LLM = text only · Vision model = images/video only · VLM = both, jointly</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1c1917"/></marker></defs>
</svg>
