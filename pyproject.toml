[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magic-vlm"
version = "0.1.21"
description = "Research code for visual reasoning on magic/mentalism demonstrations with VLMs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lucas", email = "lucaszhang1118@gmail.com" }]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Optional stacks for later stages. Not required to validate architecture.
video = ["opencv-python-headless>=4.8", "numpy>=1.24"]
# Torch is intentionally unpinned here: install a CPU or CUDA wheel that matches
# the target machine. See requirements/models.txt for a documented starting point.
# Transformers 5.16.1 was verified locally for Qwen2.5-VL class/processor APIs.
models = ["torch", "transformers>=4.45", "accelerate", "pillow"]
# DPO / GRPO post-training (TRL + PEFT). Multimodal VLM paths need CUDA + local weights.
dpo = ["torch", "transformers>=4.45", "accelerate", "peft", "trl", "datasets", "tokenizers"]
grpo = ["torch", "transformers>=4.45", "accelerate", "peft", "trl", "datasets", "tokenizers"]
dev = ["pytest>=7.4"]

[project.scripts]
magic-vlm-smoke = "magic_vlm.cli:smoke_main"
magic-vlm-init = "magic_vlm.cli:init_main"
magic-vlm-validate = "magic_vlm.cli:validate_main"
magic-vlm-sample-frames = "magic_vlm.cli:sample_main"
magic-vlm-infer = "magic_vlm.cli:infer_main"
magic-vlm-baseline = "magic_vlm.cli:baseline_main"
magic-vlm-analyze-baseline = "magic_vlm.cli:analyze_main"
magic-vlm-validate-preferences = "magic_vlm.cli:validate_preferences_main"
magic-vlm-annotate = "magic_vlm.cli:annotate_main"
magic-vlm-analyze-preferences = "magic_vlm.cli:analyze_preferences_main"
magic-vlm-train-reward = "magic_vlm.cli:train_reward_main"
magic-vlm-score-reward = "magic_vlm.cli:score_reward_main"
magic-vlm-train-dpo = "magic_vlm.cli:train_dpo_main"
magic-vlm-train-grpo = "magic_vlm.cli:train_grpo_main"
magic-vlm-temporal-shuffle = "magic_vlm.cli:temporal_shuffle_main"
magic-vlm-compare-objective = "magic_vlm.cli:compare_objective_main"
magic-vlm-compare-methods = "magic_vlm.cli:compare_methods_main"
magic-vlm-analyze-reward-hacking = "magic_vlm.cli:analyze_reward_hacking_main"
magic-vlm-report = "magic_vlm.cli:report_main"
magic-vlm-run = "magic_vlm.cli:run_main"
magic-vlm-project-health = "magic_vlm.cli:project_health_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
