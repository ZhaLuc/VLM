[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magic-vlm"
version = "0.1.7"
description = "Research code for visual reasoning on magic/mentalism demonstrations with VLMs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lucas", email = "lucaszhang1118@gmail.com" }]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Optional stacks for later stages. Not required to validate architecture.
video = ["opencv-python-headless>=4.8", "numpy>=1.24"]
# Torch is intentionally unpinned here: install a CPU or CUDA wheel that matches
# the target machine. See requirements/models.txt for a documented starting point.
# Transformers 5.16.1 was verified locally for Qwen2.5-VL class/processor APIs.
models = ["torch", "transformers>=4.45", "accelerate", "pillow"]
dev = ["pytest>=7.4"]

[project.scripts]
magic-vlm-smoke = "magic_vlm.cli:smoke_main"
magic-vlm-init = "magic_vlm.cli:init_main"
magic-vlm-validate = "magic_vlm.cli:validate_main"
magic-vlm-sample-frames = "magic_vlm.cli:sample_main"
magic-vlm-infer = "magic_vlm.cli:infer_main"
magic-vlm-baseline = "magic_vlm.cli:baseline_main"
magic-vlm-analyze-baseline = "magic_vlm.cli:analyze_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
